[package]
name = "ra-common"
version = "0.1.0"
authors = ["Brian Taylor <brian@resolvingarchitecture.io>"]
license = "MIT"
edition = "2021"
description = "Resolving Architecture - Common - Rust. Core messaging, identity, crypto and content types for the RA / 1M5 ecosystem."
homepage = "https://resolvingarchitecture.io"
documentation = "https://docs.rs/ra-common"
repository = "https://github.com/resolvingarchitecture/ra-common-rust"
readme = "README.md"
keywords = ["messaging", "envelope", "identity", "did", "crypto"]
categories = ["data-structures", "cryptography"]

[lib]
name = "ra_common"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
bs58 = "0.5"
data-encoding = "2"
subtle = "2"
lru = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

[dev-dependencies]
